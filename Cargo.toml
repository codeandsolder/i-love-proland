[package]
name = "i-love-proland"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Deterministic, topology-aware placement of forests and general world objects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/i-love-proland"
readme = "README.md"
keywords = ["procedural", "scatter", "terrain", "planet", "deterministic"]
categories = ["game-development", "graphics", "algorithms"]

[dependencies]
lorax-rs = { git = "https://github.com/codeandsolder/lorax-rs", rev = "8e04b27d2dde8074d02d416cdc5ee81ade097453" }
bytemuck = { version = "1.23", features = ["derive"], optional = true }
wgpu = { version = "30.0.2", optional = true }

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]

[dev-dependencies]
pollster = "1.0"

[[example]]
name = "gpu_compaction"
required-features = ["gpu"]

[[example]]
name = "forest_render"
required-features = ["gpu"]
