name: Source quality

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@6beddaa012211f3fbdd57df1f37424b3001b7475 # main
