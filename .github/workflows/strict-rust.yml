name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@c2e8e783839a7d72e3a26d95e4a55027b26b53f3 # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      ban-python-outside-ci: true
      allow-test-panics: true # tests use ordinary assertion and Result unwrap ergonomics
