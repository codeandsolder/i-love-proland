name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@c9dbc011bec3c43a65b62a16cbf2a3f2e31a13cb # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      ban-python-outside-ci: true
      allow-test-panics: true # tests use ordinary assertion and Result unwrap ergonomics
